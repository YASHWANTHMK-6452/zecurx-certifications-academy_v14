# Add this location inside the existing HTTPS server block.
# The upstream name resolves over the shared zecurx-shared Docker network.
location = /academy-api/v1/courses {
    limit_except GET { deny all; }
    proxy_pass http://zecurx-academy-api:8080/v1/courses;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
